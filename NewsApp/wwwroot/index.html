<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My News Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">News</div>
    </header>

    <!-- Fixed Search Section -->
    <section class="search-section">
        <input type="text" id="query" placeholder="Search for news...">
        <button onclick="searchNews()">Search</button>
    </section>

    <!-- Fixed Left Advertisement -->
    <aside class="left-ad">
        <a href="https://www.mercedes-benz.com/en/" target="_blank">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTk6ARYRAUPvX3MCmoefN9rXpS7-eDtHkjsj3WOCRNH8Q&s=10" alt="Mercedes Benz Ad">
        </a>
        <a href="https://ameriabank.am/" target="_blank">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGFuHtlG9kCN8QcrTpj815I6mlwteRwMHI6VWZTidPCw&s=10" alt="Bank Ad">
        </a>
        <a href="https://www.byd.com/eu" target="_blank">
            <img src="https://cdnus.globalso.com/nesetekauto/BYD-SONG-PLUS-EV-ELECTRIC-CAR.jpg" alt="BYD Ad">
        </a>
        <a href="https://www.paul-bakeries.com/" target="_blank">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTrvbXlZbcpRXaylWLikFYvnX0pIENae6wEgf1ctbC_dQ&s=10" alt="Cafe Ad">
        </a>
    </aside>

    <!-- News Container -->
    <main class="news-container" id="newsContainer">
        <!-- News articles will appear here -->
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 NewsApp. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
