<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My News Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">News</div>
    </header>

    <!-- Fixed Search Section -->
    <section class="search-section">
        <input type="text" id="query" placeholder="Search for news...">
        <button onclick="searchNews()">Search</button>
    </section>

    <!-- Fixed Left Advertisement -->
    <aside class="left-ad">
        <a href="https://www.scarpe.am" target="_blank">
            <img src="https://public.os.dalma.vecto.it/dalma-production/TenantCover/e28f12388029447a45ecff27f4c43df9344350b610bd65e7092a9c13627bd3bd/CAjYx.jpg" alt="SCARPE Armenia Ad">
        </a>
        <a href="https://norprojects.com/" target="_blank">
            <img src="https://media.licdn.com/dms/image/v2/D4D22AQE0pvhE330JFw/feedshare-shrink_800/B4DZyFsAHyHcAg-/0/1771769431226?e=2147483647&v=beta&t=sanp4CSbBmBWh5B-PyzRGHnKYmu5vFEs4c_rkcQzi3k" alt="Nor Projects Ad">
        </a>
        <a href="https://idbank.am/?srsltid=AfmBOoo5x50KL1_5rnXG4pOU_hrQk_RNX0RgNehi45ZyBJoBvKm4nU9q" target="_blank">
            <img src="https://banks.am/static/companies/images/076f0bd589d5ba1868eb527c102499eb.png" alt="Id Bank Ad">
        </a>
        <a href="https://www.byd.com/eu" target="_blank">
            <img src="https://cdnus.globalso.com/nesetekauto/BYD-SONG-PLUS-EV-ELECTRIC-CAR.jpg" alt="BYD Ad">
        </a>
        <a href="https://www.paul-bakeries.com/" target="_blank">
            <img src="https://galaxygroup.am/wp-content/uploads/2023/07/galaxy_paul0.png" alt="Paul Ad">
        </a>
    </aside>

    <!-- News Container -->
    <main class="news-container" id="newsContainer">
        <!-- News articles will appear here -->
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 NewsApp. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
